<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join E-Waste AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            background-color: #f0f7f4; 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px 0;
        }
        .card { 
            border: none; 
            border-radius: 24px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .btn-success { background-color: #40916c; border: none; border-radius: 12px; padding: 12px; font-weight: 600; }
        .btn-success:hover { background-color: #2d6a4f; }
        .form-control { border-radius: 12px; padding: 12px; background-color: #f8faf9; border: 1px solid #e9ecef; }
        .brand-icon { color: #40916c; font-size: 3rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="text-center mb-4">
                    <i class="bi bi-recycle brand-icon"></i>
                    <h2 class="fw-800 mt-2">Create Account</h2>
                    <p class="text-muted">Start your sustainability journey today</p>
                </div>
                <div class="card p-4 p-md-5">
                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-danger border-0 small py-2">{{ messages[0] }}</div>
                        {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="mb-3">
                            <input type="text" name="username" class="form-control" placeholder="Username" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" name="password" class="form-control" placeholder="Password" required>
                        </div>
                        <div class="mb-4">
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mb-3 shadow-sm">Register</button>
                    </form>
                    <p class="text-center mb-0 small text-muted">Already have an account? <a href="{{ url_for('login') }}" class="text-success fw-bold text-decoration-none">Login</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
